<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preload" href="/fonts/NotoMusic-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Vazirmatn-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Set direction and the Persian font before first paint so a saved
      // language does not flash as an English LTR page.
      try {
        if (localStorage.getItem('cadence.language') === 'fa') {
          document.documentElement.lang = 'fa';
          document.documentElement.dir = 'rtl';
          document.documentElement.classList.add('lang-fa');
        }
      } catch (error) {
        /* storage may be unavailable */
      }
    </script>
    <meta name="theme-color" content="#0c0d10" />
    <meta
      name="description"
      content="Learn music theory by reading, hearing, and playing it. Courses, daily review, and instrument drills for piano and guitar."
    />
    <link rel="canonical" href="https://cadance.parsasam.ir/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cadence" />
    <meta property="og:title" content="Cadence — Music Theory Trainer" />
    <meta
      property="og:description"
      content="Learn music theory by reading, hearing, and playing it. Courses, daily review, and instrument drills for piano and guitar."
    />
    <meta property="og:url" content="https://cadance.parsasam.ir/" />
    <meta property="og:image" content="https://cadance.parsasam.ir/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Cadence — Music theory, in practice" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cadence — Music Theory Trainer" />
    <meta
      name="twitter:description"
      content="Learn music theory by reading, hearing, and playing it. Courses, daily review, and instrument drills for piano and guitar."
    />
    <meta name="twitter:image" content="https://cadance.parsasam.ir/og-card.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Cadence",
        "url": "https://cadance.parsasam.ir/",
        "description": "An interactive trainer for music theory reading and listening, with piano and guitar.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "inLanguage": ["en", "fa"],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <title>Cadence — Music Theory Trainer</title>
    <script>
      // Capture the install event before the app module loads. Chrome can fire
      // it during startup, and an event missed then is gone for good.
      window.__cadenceInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        window.__cadenceInstallPrompt = event;
        window.dispatchEvent(new Event('cadence:install-available'));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
